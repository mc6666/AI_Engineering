[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matplotlib-designer"
version = "2.0.0"
description = "A visual desktop editor for designing native Matplotlib figures."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matplotlib Designer Contributors" }]
dependencies = [
    # Pinned: newer PySide6 wheels (6.8+ as of this writing) have been observed
    # to fail with "DLL load failed" (WinError 127) on some Windows installs.
    # 6.7.x is the last verified-working line; bump only after re-verifying.
    "PySide6>=6.7,<6.8",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
extra = ["scipy>=1.11", "pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5"]

[project.scripts]
matplotlib-designer = "matplotlib_designer.main:main"

[tool.setuptools.packages.find]
include = ["matplotlib_designer*"]

[tool.pytest.ini_options]
testpaths = ["matplotlib_designer/tests"]

[tool.coverage.run]
source = ["matplotlib_designer"]
omit = ["matplotlib_designer/tests/*", "matplotlib_designer/examples/*"]
