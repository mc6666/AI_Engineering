{% extends 'base.html' %}
{% block title %}刪除商品{% endblock %}
{% block page_title %}刪除商品{% endblock %}
{% block content %}
<form method="post">
  {% csrf_token %}
  <p>確定要刪除商品「{{ object.item_name }}」嗎？</p>
  <button type="submit" class="btn btn-danger">確定刪除</button>
  <a href="{% url 'inventory:item_list' %}" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
