<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>{{ filename }}</title>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

        mermaid.initialize({
            startOnLoad: true,
            theme: 'default'
        });
    </script>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            margin-top: 0;
        }

        .mermaid {
            margin-top: 20px;
        }
    </style>

</head>

<body>

<div class="container">

<h2>{{ filename }}</h2>

<div class="mermaid">
{{ diagram }}
</div>

</div>

</body>

</html>
