<!DOCTYPE html>
<html>
    <body>
        <video autoplay></video>
    </body>

    <script>
      navigator.mediaDevices
        .getUserMedia({ video: true })
        .then((localMediaStream) => {
          const video = document.querySelector("video");
          video.srcObject = localMediaStream;
        })
        .catch((error) => {
          console.log("Rejected!", error);
        });
    </script>
</html>
