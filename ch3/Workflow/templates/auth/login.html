<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業簽核系統 - 登入</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 380px; border-radius: 1rem; }
  </style>
</head>
<body>
<div class="login-card card shadow-lg p-4">
  <div class="text-center mb-4">
    <i class="bi bi-check2-square fs-1 text-primary"></i>
    <h4 class="mt-2 fw-bold">企業簽核系統</h4>
    <p class="text-muted small">請登入以繼續</p>
  </div>
  {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-danger py-2">{{ msg }}</div>
    {% endfor %}
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">帳號</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label">密碼</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">登入</button>
  </form>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</body>
</html>
