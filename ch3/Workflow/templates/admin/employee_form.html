{% extends "base.html" %}
{% block title %}{{ action }}員工{% endblock %}
{% block breadcrumb %}<a href="{% url 'employee_list' %}">員工維護</a> / {{ action }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card p-4">
  <h5 class="fw-bold mb-4">{{ action }}員工</h5>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">姓名 <span class="text-danger">*</span></label>
      <input type="text" name="name" class="form-control" value="{{ emp.name|default:'' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email <span class="text-danger">*</span></label>
      <input type="email" name="email" class="form-control" value="{{ emp.email|default:'' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">電話</label>
      <input type="text" name="tel" class="form-control" value="{{ emp.tel|default:'' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">部門代碼</label>
      <input type="text" name="department_code" class="form-control" value="{{ emp.department_code|default:'' }}">
    </div>
    {% if not emp %}
    <div class="mb-3">
      <label class="form-label">帳號 <span class="text-danger">*</span></label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">密碼 <span class="text-danger">*</span></label>
      <input type="password" name="password" class="form-control" required>
    </div>
    {% endif %}
    <div class="mb-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="is_admin" id="is_admin" {% if emp.is_admin %}checked{% endif %}>
        <label class="form-check-label" for="is_admin">系統管理者</label>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">儲存</button>
      <a href="{% url 'employee_list' %}" class="btn btn-outline-secondary">取消</a>
    </div>
  </form>
</div>
</div>
</div>
{% endblock %}
