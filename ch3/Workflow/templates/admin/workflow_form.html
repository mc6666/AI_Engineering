{% extends "base.html" %}
{% block title %}{{ action }}簽核類別{% endblock %}
{% block breadcrumb %}<a href="{% url 'workflow_list' %}">簽核類別</a> / {{ action }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card p-4">
  <h5 class="fw-bold mb-4">{{ action }}簽核類別</h5>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">類別名稱 <span class="text-danger">*</span></label>
      <input type="text" name="name" class="form-control" value="{{ wf.name|default:'' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">說明</label>
      <textarea name="description" class="form-control" rows="3">{{ wf.description|default:'' }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">審核層級數</label>
      <input type="number" name="num_levels" class="form-control" value="{{ wf.num_levels|default:1 }}" min="1">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">儲存</button>
      <a href="{% url 'workflow_list' %}" class="btn btn-outline-secondary">取消</a>
    </div>
  </form>
</div>
</div>
</div>
{% endblock %}
