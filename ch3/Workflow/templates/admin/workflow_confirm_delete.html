{% extends "base.html" %}
{% block title %}刪除簽核類別{% endblock %}
{% block breadcrumb %}<a href="{% url 'workflow_list' %}">簽核類別</a> / 刪除{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card p-4 text-center">
  <i class="bi bi-exclamation-triangle-fill fs-1 text-warning mb-3"></i>
  <h5>確定刪除「{{ wf.name }}」？</h5>
  <p class="text-muted small">相關步驟與表單設計將一併刪除。若有關聯案件則無法刪除。</p>
  <form method="post" class="d-flex gap-2 justify-content-center mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">確定刪除</button>
    <a href="{% url 'workflow_list' %}" class="btn btn-outline-secondary">取消</a>
  </form>
</div>
</div>
</div>
{% endblock %}
